# 每日检查 Google 官方来源，安全更新 Gemini 全景，并调用独立工作流发布页面。
name: 更新 Gemini 演进全景

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: gemini-panorama-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      checked_at: ${{ steps.update-result.outputs.checked_at }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 检查并暂存官方更新
        run: python3 work/update-gemini-panorama.py --result-path /tmp/gemini-update-result.json

      - name: 重建仓库内离线页面
        run: python3 work/build-page.py

      - name: 检查内嵌 JavaScript 语法
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("outputs/gemini-evolution-panorama.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*type="application/json")[^>]*>(.*?)</script>', html, re.S)
          Path("/tmp/gemini-panorama-script.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/gemini-panorama-script.js

      - name: 运行全部测试
        run: |
          python3 -m unittest \
            tests/test_timeline_data.py \
            tests/test_gemini_evolution_panorama.py \
            tests/test_source_parser.py \
            tests/test_auto_update.py \
            tests/test_workflow_static.py \
            -v

      - name: 读取更新结果
        id: update-result
        run: |
          python3 -m json.tool /tmp/gemini-update-result.json
          echo "content_changed=$(python3 -c 'import json; print(str(json.load(open("/tmp/gemini-update-result.json"))["content_changed"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "checked_at=$(python3 -c 'import json; print(json.load(open("/tmp/gemini-update-result.json"))["checked_at"])')" >> "$GITHUB_OUTPUT"

      - name: 提交可信内容变化
        if: steps.update-result.outputs.content_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            work/timeline-data.json \
            work/source-state.json \
            outputs/gemini-evolution-panorama.html \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo "更新器报告变化，但没有可提交文件。"
          else
            git commit -m "更新: 自动同步 Gemini 官方资料"
            git push
          fi

  deploy-pages:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-gemini-pages.yml
    with:
      checked_at: ${{ needs.update.outputs.checked_at }}
